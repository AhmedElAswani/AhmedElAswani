<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111c30"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<rect width="1000" height="760" rx="28" fill="url(#bg)"/>
<text x="500" y="68" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="1">CLEAN ARCHITECTURE</text>
<text x="500" y="103" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">A dependency rule: source code dependencies point inward</text>
<!-- rings -->
<circle cx="500" cy="405" r="275" fill="#1b2940" stroke="#a78bfa" stroke-width="3"/>
<circle cx="500" cy="405" r="215" fill="#203957" stroke="#60a5fa" stroke-width="3"/>
<circle cx="500" cy="405" r="153" fill="#15504c" stroke="#34d399" stroke-width="3"/>
<circle cx="500" cy="405" r="88" fill="#166534" stroke="#86efac" stroke-width="3"/>
<!-- center -->
<text x="500" y="395" text-anchor="middle" fill="#f0fdf4" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">ENTITIES</text>
<text x="500" y="423" text-anchor="middle" fill="#dcfce7" font-family="Inter,Arial,sans-serif" font-size="13">Enterprise Rules</text>
<!-- use case label -->
<rect x="385" y="263" width="230" height="54" rx="12" fill="#102f2d" stroke="#34d399"/>
<text x="500" y="286" text-anchor="middle" fill="#d1fae5" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">USE CASES</text>
<text x="500" y="304" text-anchor="middle" fill="#a7f3d0" font-family="Inter,Arial,sans-serif" font-size="11">Application Business Rules</text>
<!-- adapters label -->
<rect x="330" y="165" width="340" height="58" rx="12" fill="#172c48" stroke="#60a5fa"/>
<text x="500" y="190" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">INTERFACE ADAPTERS</text>
<text x="500" y="210" text-anchor="middle" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="12">Controllers • Presenters • Gateways</text>
<!-- frameworks label -->
<rect x="315" y="122" width="370" height="1" fill="#a78bfa" opacity="0"/>
<rect x="300" y="125" width="400" height="1" fill="#a78bfa" opacity="0"/>
<text x="500" y="145" text-anchor="middle" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">FRAMEWORKS &amp; DRIVERS</text>
<text x="500" y="164" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="11">UI • Database • Web • Devices</text>
<!-- dependency arrows inward -->
<path d="M500 205 L500 245" stroke="#f8fafc" stroke-width="3" fill="none"/>
<path d="M490 235 L500 247 L510 235" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M500 322 L500 342" stroke="#f8fafc" stroke-width="3" fill="none"/>
<path d="M490 333 L500 345 L510 333" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- bottom legend -->
<g font-family="Inter,Arial,sans-serif">
<rect x="110" y="710" width="18" height="18" rx="4" fill="#166534" stroke="#86efac"/><text x="138" y="724" fill="#cbd5e1" font-size="13">Core business rules</text>
<rect x="350" y="710" width="18" height="18" rx="4" fill="#15504c" stroke="#34d399"/><text x="378" y="724" fill="#cbd5e1" font-size="13">Application rules</text>
<rect x="590" y="710" width="18" height="18" rx="4" fill="#203957" stroke="#60a5fa"/><text x="618" y="724" fill="#cbd5e1" font-size="13">Adapters</text>
<rect x="770" y="710" width="18" height="18" rx="4" fill="#1b2940" stroke="#a78bfa"/><text x="798" y="724" fill="#cbd5e1" font-size="13">External</text>
</g>
</svg>