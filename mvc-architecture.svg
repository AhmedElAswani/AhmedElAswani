<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111c30"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#cbd5e1"/></marker>
</defs>
<rect width="1000" height="760" rx="28" fill="url(#bg)"/>
<text x="500" y="68" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="1">MVC ARCHITECTURE</text>
<text x="500" y="103" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Model • View • Controller</text>
<!-- user -->
<rect x="410" y="145" width="180" height="58" rx="14" fill="#202b3d" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
<text x="500" y="181" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">USER</text>
<!-- components -->
<rect x="90" y="330" width="230" height="150" rx="18" fill="#172f50" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="205" y="380" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">VIEW</text>
<text x="205" y="415" text-anchor="middle" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="16">User Interface</text>
<text x="205" y="443" text-anchor="middle" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="13">Displays information</text>
<rect x="385" y="330" width="230" height="150" rx="18" fill="#302852" stroke="#a78bfa" stroke-width="3" filter="url(#shadow)"/>
<text x="500" y="380" text-anchor="middle" fill="#ede9fe" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">CONTROLLER</text>
<text x="500" y="415" text-anchor="middle" fill="#ddd6fe" font-family="Inter,Arial,sans-serif" font-size="15">Handles user input</text>
<text x="500" y="443" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="13">Coordinates application flow</text>
<rect x="680" y="330" width="230" height="150" rx="18" fill="#12443f" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="795" y="380" text-anchor="middle" fill="#d1fae5" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">MODEL</text>
<text x="795" y="415" text-anchor="middle" fill="#a7f3d0" font-family="Inter,Arial,sans-serif" font-size="15">Data &amp; Business Logic</text>
<text x="795" y="443" text-anchor="middle" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="13">Manages application state</text>
<!-- arrows -->
<path d="M500 203 L500 285 L205 285 L205 322" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
<text x="330" y="272" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Interacts with</text>
<path d="M320 385 L377 385" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
<text x="350" y="365" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="12">User actions</text>
<path d="M615 385 L672 385" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
<text x="644" y="365" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="12">Requests / updates</text>
<path d="M795 488 L795 555 L205 555 L205 488" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="545" text-anchor="middle" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="14">Updated data returned to the View</text>
<path d="M500 480 L500 620 L205 620 L205 488" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<text x="500" y="650" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="13">Controller selects or updates the View</text>
<text x="500" y="710" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14">Separation of Concerns</text>
</svg>